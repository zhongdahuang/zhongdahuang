# 个人页仓库 zhongdahuang/zhongdahuang：从主页仓库取生成好的 README，每周一同步一次。
name: Sync profile README
on:
  schedule:
    - cron: "47 14 * * 1"   # 主页生成后半小时
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://raw.githubusercontent.com/zhongdahuang/zhongdahuang.github.io/main/profile-README.md -o README.md
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Sync README from homepage" && git push
